*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.45 Atkinson,system-ui,sans-serif;overflow-wrap:anywhere;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.h{font-family:Hanken,system-ui,sans-serif;font-weight:800;letter-spacing:-.012em;margin:0;line-height:1.15}
h1{font-size:1.75rem}h2{font-size:1.2rem}h3{font-size:1.02rem;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
button:disabled{cursor:default}
a{color:var(--accent-ink)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
svg.i{width:1.25em;height:1.25em;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.25em}
.muted{color:var(--muted)}.small{font-size:.9rem}.b{font-weight:700}.num{font-family:Hanken,system-ui,sans-serif;font-weight:800;font-variant-numeric:tabular-nums}
.warn-t{color:var(--red-ink)}html[data-theme=dark] .warn-t{color:#F8B7AE}
/* shell */
#shell{min-height:100dvh;display:flex}
#rail{display:none}
#main{flex:1;min-width:0;display:flex;flex-direction:column}

.railsep{height:1px;background:rgba(255,255,255,.16);margin:8px 8px}

#top{background:var(--bg);color:var(--ink);padding:10px 24px;border-bottom:1px solid var(--line)}

}

.btn:disabled{opacity:1;background:var(--card2);color:var(--muted);border:1px solid var(--line)}
.linkbtn{min-height:44px;display:inline-flex;align-items:center;gap:6px;color:var(--accent-ink);text-decoration:underline;font-weight:700;padding:0 4px}

.iconbtn.on{color:var(--gold-ink)}.iconbtn.on svg{fill:var(--gold)}
label{display:block}

.f input,.f select,.f textarea,.inp{display:block;width:100%;min-height:46px;margin:0;padding:9px 12px;border-radius:11px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-weight:400;font-size:1rem}
html[data-theme=dark] .f input,html[data-theme=dark] .f select,html[data-theme=dark] .f textarea,html[data-theme=dark] .inp{background:#0F2419}

.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;align-items:end}

.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--line);border-radius:13px;overflow:hidden;background:var(--card)}
.seg button{min-height:44px;padding:0 16px;font-weight:700;color:var(--ink)}

.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border-radius:22px;font-weight:700;font-size:.9rem;white-space:nowrap;flex:none}
.st-idea{background:var(--s-idea-b);color:var(--s-idea-i)}.st-bought{background:var(--s-bought-b);color:var(--s-bought-i)}.st-ship{background:var(--s-ship-b);color:var(--s-ship-i)}.st-here{background:var(--s-here-b);color:var(--s-here-i)}.st-wrapped{background:var(--s-wrapped-b);color:var(--s-wrapped-i)}.st-given{background:var(--s-given-b);color:var(--s-given-i)}

.av{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--pine2);color:#FBF6EC;font-family:Hanken,system-ui,sans-serif;font-weight:800;font-size:1rem;flex:none}

.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:12px;margin-bottom:16px}

.grouphead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.grouphead .gh-t{flex:1;min-width:0}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 0;border-top:1px solid var(--line)}

.row-main{flex:1 1 150px;min-width:0;min-height:44px;display:block;border-radius:8px}

.bar{height:10px;border-radius:5px;background:var(--track);display:flex;overflow:hidden;margin:8px 0 4px}

.toolbar{display:grid;gap:10px;grid-template-columns:minmax(0,1fr);margin-bottom:16px}
.filters{display:grid;gap:8px;grid-template-columns:repeat(3,minmax(0,1fr))}
.filters select{padding-left:8px;padding-right:2px}

.searchwrap{position:relative}
.searchwrap svg{position:absolute;left:12px;top:13px;color:var(--muted)}
.searchwrap input{padding-left:40px}
.note{padding:10px 12px;border-radius:12px;background:var(--gold-bg);color:var(--gold-ink);font-weight:700;font-size:.93rem;display:flex;gap:8px;align-items:flex-start;margin-bottom:12px}

.morelist{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
@media (min-width:768px){.morelist{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:768px){.morelink{min-height:118px}}
.morelink{display:flex;align-items:center;gap:14px;min-height:72px;text-decoration:none;color:var(--ink)}
.morelink .ic{width:44px;height:44px;border-radius:13px;background:var(--card2);display:flex;align-items:center;justify-content:center;color:var(--accent-ink);flex:none}

.needs{display:grid}

/* fair */
.fairgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(88px,1fr))}

.vbar{width:100%;height:10px;border-radius:5px;background:var(--track);overflow:hidden}.vbar i{display:block;height:100%;background:var(--bar1)}

<script>
'use strict';
/* Christmas Gift Tracker. One offline file: no network, no framework. Everything lives in localStorage. */
const DEMO = false;
const KEY = DEMO ? 'ngd-gifts-demo-' : 'ngd-gifts-';
/* ---------- constants ---------- */
const STAT = [
{k:'idea', w:'Idea', i:'bulb'}, {k:'bought', w:'Bought', i:'bag'}, {k:'ship', w:'On its way', i:'truck'},
{k:'here', w:'Here', i:'box'}, {k:'wrapped', w:'Wrapped', i:'bow'}, {k:'given', w:'Given', i:'check'}];
const TYPES = {gift:'Gift', stocking:'Stocking stuffer', card:'Gift card', experience:'Experience', other:'Other cost (wrapping, postage)'};
const GROUPS = ['Kids', 'Family', 'Partner', 'Friends', 'Work'];
const NAV = [
{v:'home', w:'Home', i:'home', tab:1}, {v:'gifts', w:'Gifts', i:'gift', tab:1}, {v:'people', w:'People', i:'people', tab:1}, {v:'ideas', w:'Ideas', i:'bulb', tab:1},
{v:'fair', w:'Fair for kids', i:'scale', d:'Even out gifts and money'}, {v:'shopping', w:'Shopping', i:'cart', d:'What is left to buy, by store'}, {v:'deliveries', w:'Deliveries', i:'truck', d:'Packages on the way'},
{v:'wrapping', w:'Wrapping day', i:'bow', d:'Bought, not wrapped, by hiding spot'}, {v:'santa', w:'Secret Santa', i:'swap', d:'Draw names, pass the phone'}, {v:'cards', w:'Cards + thank-yous', i:'card', d:'Who gets a card, who got thanked'},
{v:'seasons', w:'Seasons', i:'cal', d:'Past years, birthdays, next year'}, {v:'kids', w:'Kids nearby', i:'eyeoff', d:'Hide prices, disguise, PIN'}, {v:'share', w:'Share + backup', i:'share', d:'Backup file, CSV, partner merge'}, {v:'settings', w:'Settings', i:'gear', d:'Theme, currency, season, sample'}];
const GROCERY = ['Milk','Eggs','Bread','Bananas','Apples','Chicken thighs','Rice','Pasta','Tomato sauce','Cheddar cheese','Yogurt','Carrots','Onions','Dish soap','Paper towels','Coffee'];

/* ---------- small helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function icon(n, cls = '') { return `<svg class="i ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`; }
const clone = o => JSON.parse(JSON.stringify(o));
const round2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
let idCounter = 0;
function uid() { return Date.now().toString(36) + (++idCounter).toString(36) + Math.random().toString(36).slice(2, 7); }
let lastStamp = 0;
function stamp() { lastStamp = Math.max(Date.now(), lastStamp + 1); return lastStamp; }
function pad(n) { return String(n).padStart(2, '0'); }
function dateStr(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function todayStr() { return dateStr(new Date()); }
function parseDay(s) { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
function daysUntil(s, from = todayStr()) { const a = parseDay(from), b = parseDay(s); return b ? Math.round((b - a) / 864e5) : null; }
function addDays(s, n) { const d = parseDay(s); d.setDate(d.getDate() + n); return dateStr(d); }
function niceDate(s) { const d = parseDay(s); return d ? d.toLocaleDateString('en-US', {month:'short', day:'numeric'}) : ''; }
function longDate(s) { const d = parseDay(s); return d ? d.toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric', year:'numeric'}) : ''; }
function defaultChristmas() { const y = new Date().getFullYear(); const c = `${y}-12-25`; return daysUntil(c) < 0 ? `${y + 1}-12-25` : c; }
function blackFriday(year) { const d = new Date(year, 10, 1); while (d.getDay() !== 4) d.setDate(d.getDate() + 1); d.setDate(d.getDate() + 22); return dateStr(d); }
function parsePrice(v) { if (v == null) return null; const t = String(v).replace(/[^0-9.]/g, ''); if (!t) return null; const n = parseFloat(t); return isFinite(n) ? round2(n) : null; }
function plural(n, w, p) { return `${n} ${n === 1 ? w : (p || w + 's')}`; }
function initials(name) { const w = String(name || '').trim().split(/\s+/).filter(Boolean); return ((w[0] || '?')[0] + (w.length > 1 ? w[w.length - 1][0] : '')).toUpperCase(); }

/* ---------- storage ---------- */
function blankData() { return {schema:1, activeSeason:null, seasons:[], people:[], gifts:[], tombstones:[], groups:GROUPS.slice()}; }
function blankPrefs() { return {theme:'auto', currency:'$', large:false, hidePrices:false, disguised:false, lastBackup:null, firstUse:null, onboarded:false, pin:null, disguiseHintSeen:false, persistAsked:false, activeBeforeSample:null, grocery:{}}; }
let S = blankData(), P = blankPrefs(), storageOK = true;
function load() {
try {
const d = localStorage.getItem(KEY + 'data'), p = localStorage.getItem(KEY + 'prefs');
S = d ? Object.assign(blankData(), JSON.parse(d)) : blankData();
P = p ? Object.assign(blankPrefs(), JSON.parse(p)) : blankPrefs();
} catch (e) { storageOK = false; S = blankData(); P = blankPrefs(); }
}
function save() { try { localStorage.setItem(KEY + 'data', JSON.stringify(S)); } catch (e) { storageOK = false; toast('This browser would not save that. Export a backup now.', {warn:true}); } }
function savePrefs() { try { localStorage.setItem(KEY + 'prefs', JSON.stringify(P)); } catch (e) { storageOK = false; } }
function askPersist() {
if (P.persistAsked) return; P.persistAsked = true; savePrefs();
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* older browsers: nothing to do */ }
}

/* ---------- lookups ---------- */
function season(id) { return S.seasons.find(x => x.id === (id || S.activeSeason)) || null; }
function person(id) { return S.people.find(x => x.id === id) || null; }
function gift(id) { return S.gifts.find(x => x.id === id) || null; }
function peopleOf(sid) { return S.people.filter(x => x.seasonId === (sid || S.activeSeason)); }
/* Gifts = everything on the list. The idea bank (bank:true) is a wish pile: it costs nothing until moved to Gifts. */
function realGifts() { return S.gifts.filter(g => !g.bank); }
function giftsOf(sid) { return S.gifts.filter(g => g.seasonId === (sid || S.activeSeason) && !g.bank); }
function bankOf(sid) { return S.gifts.filter(g => g.seasonId === (sid || S.activeSeason) && g.bank); }
function giftsFor(pid) { return S.gifts.filter(g => g.personId === pid && !g.bank); }
function RO() { const s = season(); return !!(s && s.archived); }
function statIdx(k) { return STAT.findIndex(x => x.k === k); }
function statOf(k) { return STAT[Math.max(0, statIdx(k))]; }
function isBought(g) { return statIdx(g.status) >= 1; }
function isCounted(g) { return g.type !== 'other'; }

/* ---------- money math ---------- */
function money(n) {
if (P.hidePrices) return '••••';
const v = round2(+n || 0), abs = Math.abs(v);
const t = abs.toLocaleString('en-US', {minimumFractionDigits: Number.isInteger(abs) ? 0 : 2, maximumFractionDigits: 2});
return (v < 0 ? '-' : '') + P.currency + t;
}
function costOf(g) { return isBought(g) ? (g.paid ?? g.planned ?? 0) : (g.planned ?? 0); }
function spentOf(gs) { return round2(gs.filter(isBought).reduce((a, g) => a + (g.paid ?? g.planned ?? 0), 0)); }
/* Committed = ideas at their planned price + bought gifts at what you paid. */
function committedOf(gs) { return round2(gs.reduce((a, g) => a + costOf(g), 0)); }
function savedOf(gs) { return round2(gs.filter(isBought).reduce((a, g) => { const p = g.paid ?? g.planned; return a + (g.full != null && p != null && g.full > p ? g.full - p : 0); }, 0)); }
function leftOf(budget, gs) { return round2((+budget || 0) - committedOf(gs)); }
function overBudgetBy(p, gs) { if (!p || !p.budget) return 0; return Math.max(0, round2(committedOf(gs) - p.budget)); }
/* The warning for a gift being added or edited. Warns, never blocks. Returns text or ''. */
function overWarning(personId, draft) {
const p = person(personId); if (!p || !p.budget) return '';
const others = giftsFor(personId).filter(g => g.id !== draft.id);
const over = overBudgetBy(p, others.concat(draft.bank ? [] : [draft]));
if (!over) return '';
return P.hidePrices ? `This puts ${p.name} over their budget.` : `This puts ${p.name} ${money(over)} over their ${money(p.budget)} budget.`;
}
function weeklySavings(s, gs) {
const days = daysUntil(s.date); if (days == null || days < 0) return null;
const weeks = Math.max(1, Math.ceil(days / 7));
const target = s.budget ? s.budget - spentOf(gs) : committedOf(gs) - spentOf(gs);
return {perWeek: target > 0 ? Math.ceil(round2(target / weeks)) : 0, weeks, target: Math.max(0, round2(target))};
}
function isLate(g, today = todayStr()) { return g.status === 'ship' && !!g.arriveBy && g.arriveBy < today; }
function ringCounts(gs) {
const c = gs.filter(isCounted), at = n => c.filter(g => statIdx(g.status) >= n).length;
return {total:c.length, bought:at(1), wrapped:at(4), given:at(5)};
}
function storeGroups(gs) {
const m = new Map();
gs.forEach(g => { const k = (g.store || '').trim() || 'No store yet'; if (!m.has(k)) m.set(k, {store:k, items:[], subtotal:0}); const e = m.get(k); e.items.push(g); e.subtotal = round2(e.subtotal + (g.planned ?? 0)); });
return [...m.values()].sort((a, b) => (a.store === 'No store yet') - (b.store === 'No store yet') || b.items.length - a.items.length || a.store.localeCompare(b.store));
}
function toBuy(sid) { return giftsOf(sid).filter(g => g.status === 'idea'); }
function fairStats(group, sid) {
const rows = peopleOf(sid).filter(p => p.group === group).map(p => {
const gs = giftsFor(p.id).filter(isCounted);
return {person:p, count:gs.length, money:committedOf(gs)};
});
if (rows.length < 2) return {rows, moneyDiff:0, countDiff:0, most:rows[0] || null, least:rows[0] || null};
const by = rows.slice().sort((a, b) => b.money - a.money || b.count - a.count);
const counts = rows.map(r => r.count);
return {rows, most:by[0], least:by[by.length - 1], moneyDiff:round2(by[0].money - by[by.length - 1].money), countDiff:Math.max(...counts) - Math.min(...counts)};
}

/* ---------- repeat warning ---------- */
const STOP = new Set(['a','an','the','of','for','and','set','kit','with','new','my','to']);
function words(t) { return String(t || '').toLowerCase().replace(/[^a-z0-9 ]+/g, ' ').split(/\s+/).filter(w => w && !STOP.has(w)).map(w => w.replace(/s$/, '')); }
function similarTitle(a, b) {
const x = words(a), y = words(b); if (!x.length || !y.length) return false;
if (x.join(' ') === y.join(' ')) return true;
const sy = new Set(y), shared = [...new Set(x)].filter(w => sy.has(w)).length;
const union = new Set(x.concat(y)).size;
return shared / union >= 0.6 || (shared >= 1 && shared === Math.min(new Set(x).size, sy.size) && Math.min(x.length, y.length) >= 2);
}
function pastGiftsFor(p) {
if (!p) return [];
const others = S.people.filter(q => q.id !== p.id && q.seasonId !== p.seasonId && (q.key === p.key || q.name.trim().toLowerCase() === p.name.trim().toLowerCase()));
return others.flatMap(q => giftsFor(q.id).map(g => ({g, season:season(q.seasonId)}))).filter(x => x.season);
}
function repeatMatches(personId, title) { return pastGiftsFor(person(personId)).filter(x => similarTitle(title, x.g.title)); }
function lastGave(p) {
const past = pastGiftsFor(p).filter(x => x.season.date < (season(p.seasonId)?.date || '9999'));
if (!past.length) return null;
const newest = past.map(x => x.season.date).sort().pop();
return {season:past.find(x => x.season.date === newest).season, titles:past.filter(x => x.season.date === newest).map(x => x.g.title)};
}

/* ---------- Secret Santa ---------- */
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function santaBanned(a, b, excl) { return a === b || excl.some(([x, y]) => (x === a && y === b) || (x === b && y === a)); }
/* Random draw, then a complete matching search, so "impossible" is only ever said when it truly is. */
function santaDraw(names, excl = [], seed = Math.floor(Math.random() * 2 ** 31)) {
const n = names.length; if (n < 2) return null;
const r = rng(seed);
const shuffled = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
for (let t = 0; t < 200; t++) {
const rec = shuffled(names);
if (names.every((g, i) => !santaBanned(g, rec[i], excl))) return Object.fromEntries(names.map((g, i) => [g, rec[i]]));
}
const owner = new Map();
const tryGiver = (g, seen) => {
for (const c of shuffled(names)) {
if (santaBanned(g, c, excl) || seen.has(c)) continue;
seen.add(c);
if (!owner.has(c) || tryGiver(owner.get(c), seen)) { owner.set(c, g); return true; }
}
return false;
};
for (const g of names) if (!tryGiver(g, new Set())) return null;
const out = {}; owner.forEach((g, c) => { out[g] = c; }); return out;
}
function santaProblem(names, excl) {
if (names.length < 2) return 'Add at least two names to draw.';
const stuck = names.find(a => names.every(b => santaBanned(a, b, excl)));
if (stuck) return `No valid draw is possible: ${stuck} has nobody left to draw. Remove one of their can't-draw pairs.`;

function giftDraft(f) {

function giftWarnings(d) {

/* ---------- people ---------- */
function moneyBar(p, gs) {
const sp = spentOf(gs), c = committedOf(gs), b = p.budget || 0, base = Math.max(b, c) || 1;
const a = 100 * Math.min(sp, b || sp) / base, pl = 100 * Math.max(0, Math.min(c, b || c) - Math.min(sp, b || sp)) / base, o = b && c > b ? 100 * (c - b) / base : 0;
return `<div class="bar" role="img" aria-label="Budget used"><i class="a" style="width:${a.toFixed(1)}%"></i><i class="c" style="width:${pl.toFixed(1)}%"></i><i class="o" style="width:${o.toFixed(1)}%"></i></div>`;
}
function personCard(p) {
const gs = giftsFor(p.id), sp = spentOf(gs), c = committedOf(gs), over = overBudgetBy(p, gs), last = lastGave(p), ro = RO();
return `<section class="card" data-person="${p.id}">
<div class="grouphead">${avatar(p)}<div class="gh-t"><h2>${esc(p.name)}</h2><div class="small muted">${esc(p.group)} · ${plural(gs.length, 'gift')}</div></div>${ro ? '' : `<button class="btn ghost sm" data-act="editPerson" data-id="${p.id}" aria-label="Edit ${esc(p.name)}">Edit</button>`}</div>
${moneyBar(p, gs)}
<p class="small ${over ? 'warn-t b' : 'muted'}" data-money>${P.hidePrices ? (over ? `${icon('alert')} Over budget` : 'Prices hidden') : `${money(sp)} spent + ${money(round2(c - sp))} planned${p.budget ? ` of ${money(p.budget)}` : ''}${over ? `. ${money(over)} over` : ''}`}</p>

/* ---------- fair ---------- */
function vFair() {
const groups = [...new Set(peopleOf().map(p => p.group))];
if (!groups.includes(fairGroup)) fairGroup = groups.includes('Kids') ? 'Kids' : (groups[0] || 'Kids');
const fs = fairStats(fairGroup), top = Math.max(1, ...fs.rows.map(r => r.money));
const pick = `<label class="f" style="margin:0;flex:0 1 220px"><span>Group</span><select id="fairPick" data-pick="fair">${(groups.length ? groups : ['Kids']).map(g => `<option ${g === fairGroup ? 'selected' : ''}>${esc(g)}</option>`).join('')}</select></label>`;
let body;
if (fs.rows.length < 2) body = emptyCard('scale', 'Nothing to compare yet', `Add at least two people to the ${fairGroup} group and they will show up side by side here.`, addBtn('Add a person', 'addPerson'));
else {
const msg = P.hidePrices ? `${fs.most.person.name} has the most and ${fs.least.person.name} the least. The gift count differs by ${fs.countDiff}.`
: fs.moneyDiff || fs.countDiff ? `${fs.most.person.name} has ${money(fs.moneyDiff)} more than ${fs.least.person.name}. The gift count differs by ${fs.countDiff}.` : 'Everyone is even. Nicely done.';
body = `<div class="cols side"><section class="card" aria-label="Side by side"><div class="fairgrid" style="margin-bottom:0">${fs.rows.map(r => `<div class="fairc" data-fair="${r.person.id}">${avatar(r.person)}<h3>${esc(r.person.name)}</h3><div class="n">${r.count}</div><div class="small muted">${r.count === 1 ? 'gift' : 'gifts'}</div><div class="num">${money(r.money)}</div><div class="vbar"><i style="width:${(100 * r.money / top).toFixed(0)}%"></i></div><ul class="fairlist">${giftsFor(r.person.id).filter(isCounted).map(g => `<li class="lr"><span>${esc(g.title)}</span>${P.hidePrices ? '' : `<span class="small b">${money(costOf(g))}</span>`}</li>`).join('')}</ul></div>`).join('')}</div></section>
<section class="card"><h2>Most vs. least</h2><div class="stat" style="border:0;box-shadow:none;padding:10px 0"><div class="n" id="fairDiff">${money(fs.moneyDiff)}</div><div class="l">difference, ${plural(fs.countDiff, 'gift')} apart</div></div><p id="fairMsg" style="margin-bottom:12px">${esc(msg)}</p>
${RO() ? '' : `<button class="btn" data-act="evenOut" data-id="${fs.least.person.id}">${icon('plus')}Add to even it out</button>`}</section></div>`;
}
return `<div class="vhead"><h1>Fair for kids</h1>${pick}</div>${body}`;
}

}

/* ---------- sheets ---------- */
function openSheet(html) { const d = $('#sheet'); d.innerHTML = `<div class="inner">${html}</div>`; if (!d.open) d.showModal(); d.scrollTop = 0; }
function closeSheet() { const d = $('#sheet'); if (d.open) d.close(); d.innerHTML = ''; }
let pendingYes = null;
function confirmSheet({title, body, yes, danger, type, onYes}) {
pendingYes = onYes;
openSheet(`<form data-form="confirm" data-type="${esc(type || '')}" novalidate><h2 id="sheetTitle">${esc(title)}</h2><p style="margin-bottom:14px">${esc(body)}</p>
${type ? `<label class="f"><span>Type ${esc(type)} to confirm</span><input id="confirmType" name="t" autocomplete="off"></label><div id="confirmErr"></div>` : ''}
<div class="actions"><span class="spacer"></span><button type="button" class="btn ghost sm" data-act="closeSheet">Cancel</button><button class="btn ${danger ? 'danger' : ''}" id="confirmYes">${esc(yes)}</button></div></form>`);
}
function openTickSheet(g) {
openSheet(`<form data-form="tick" data-id="${g.id}" novalidate><h2 id="sheetTitle">Bought it. What did you pay?</h2><p class="muted" style="margin-bottom:12px">${esc(g.title)}</p>
<label class="f"><span>Price paid</span><input id="tickPrice" name="paid" inputmode="decimal" value="${g.planned ?? ''}" autocomplete="off"></label>
<div class="actions"><span class="spacer"></span><button type="button" class="btn ghost sm" data-act="closeSheet">Cancel</button><button class="btn" id="tickSave">Mark bought</button></div></form>`);
$('#tickPrice').select();
}
function openSeasonSheet() {
openSheet(`<form data-form="seasonNew" novalidate><h2 id="sheetTitle">Add a season</h2><p class="muted" style="margin-bottom:12px">A birthday, an anniversary, any day you buy gifts for.</p>
${textField('name', 'Name', '', 'id="snName" maxlength="60" placeholder="Maya\'s birthday"')}<div class="${P.hidePrices ? '' : 'two'}"><label class="f"><span>Date</span><input type="date" id="snDate" name="date" value="${addDays(todayStr(), 30)}"></label>${priceField('budget', 'Budget (optional)', null)}</div>
<div id="snErr"></div><div class="actions"><span class="spacer"></span><button type="button" class="btn ghost sm" data-act="closeSheet">Cancel</button><button class="btn" id="snSave">Add season</button></div></form>`);
}

/* ---------- file import: validated first; a bad file changes nothing ---------- */
function parseImport(text) {
let o; try { o = JSON.parse(text); } catch (e) { return {ok:false, error:'This file could not be read. Nothing was changed.'}; }
const v = validateBackup(o);
return v.ok ? {ok:true, obj:o} : {ok:false, error:`${v.error} Nothing was changed.`};
}
function applyRestore(o) { snap(); S = normalizeData(o.data); P.onboarded = true; save(); savePrefs(); importMsg = ''; }
function applyMerge(o) { snap(); const m = mergeShare(S, o.data); S = m.state; P.onboarded = true; save(); savePrefs(); importMsg = ''; return m.report; }
function handleFile(kind, text) {
const r = parseImport(text);
if (!r.ok) { importMsg = r.error; paint(); return false; }
if (kind === 'merge') { const m = applyMerge(r.obj); paint(); toast(`Merged: ${m.added} added, ${m.updated} updated, ${m.kept} kept.`, {undo:true}); return true; }
const d = r.obj.data;
confirmSheet({title:'Replace everything here?', body:`This file has ${plural(d.seasons.length, 'season')}, ${plural(d.people.length, 'person', 'people')} and ${plural(d.gifts.length, 'gift')}. It replaces what is on this device now.`, yes:'Replace', onYes:() => { applyRestore(r.obj); paint(); toast('Backup restored.', {undo:true}); }});
return true;
}
function copyText(t) {
const fallback = () => { const a = document.createElement('textarea'); a.value = t; a.style.position = 'fixed'; a.style.opacity = '0'; ($('#sheet').open ? $('#sheet') : document.body).appendChild(a); a.select(); try { document.execCommand('copy'); } catch (e) { /* the text stays visible on the card */ } a.remove(); };
if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).catch(fallback); else fallback();
}
function keepScroll(fn) { const y = window.scrollY; fn(); window.scrollTo(0, y); }
function repaint() { keepScroll(paint); }
function afterOver(personId, g) { const w = giftWarnings(Object.assign({}, g)).slice(0, 1)[0]; if (w) toast(w, {warn:true}); return w; }

/* ---------- actions ---------- */
const ACT = {
undo, closeSheet,
toggleHide() { P.hidePrices = !P.hidePrices; savePrefs(); closeSheet(); repaint(); },
disguise() { P.disguised = true; savePrefs(); closeSheet(); paint(); window.scrollTo(0, 0); if (!P.disguiseHintSeen) { P.disguiseHintSeen = true; savePrefs(); toast('To come back, press and hold the words Grocery list.'); } },
addGift() { if (canEdit()) openGiftSheet(null); },
addGiftFor(el) { if (canEdit()) openGiftSheet(null, {personId:el.dataset.id}); },
addIdea() { if (canEdit()) openGiftSheet(null, {bank:true}); },
editGift(el) { const g = gift(el.dataset.id); if (g && canEdit()) openGiftSheet(g); },
deleteGift(el) { if (!canEdit()) return; const g = gift(el.dataset.id); snap(); deleteGift(g.id); save(); closeSheet(); repaint(); toast(`Deleted ${g.title}.`, {undo:true}); },
advance(el) {
if (!canEdit()) return; const g = gift(el.dataset.id), nx = STAT[statIdx(g.status) + 1]; if (!g || !nx) return;
snap(); setStatus(g, nx.k); save();
const row = el.closest('[data-gift]');
row.outerHTML = giftRow(g);
const c = $(`[data-gift="${g.id}"] .chip`); c.classList.add('pop'); c.focus({preventScroll:true});
const sub = $(`[data-group="${g.personId || 'none'}"] .gh-sub`); if (sub && g.personId) sub.textContent = groupSub(person(g.personId), []);
toast(`${g.title}: ${nx.w}`, {undo:true});
},
clearFilters() { Object.assign(giftFilter, {q:'', person:'', status:'', store:''}); paint(); },
addPerson() { if (canEdit()) openPersonSheet(null); },
editPerson(el) { const p = person(el.dataset.id); if (p && canEdit()) openPersonSheet(p); },
deletePerson(el) { if (!canEdit()) return; const p = person(el.dataset.id); snap(); deletePerson(p.id); save(); closeSheet(); repaint(); toast(`Removed ${p.name}. Their gifts moved to No one yet.`, {undo:true}); },
evenOut(el) { if (!canEdit()) return; const fs = fairStats(fairGroup); openGiftSheet(null, {personId:el.dataset.id, planned:fs.moneyDiff || null}); },
saveIdea(el) {
if (!canEdit()) return; const i = IDEAS.find(x => x[0] === el.dataset.title), p = person(finder.who);
snap(); S.gifts.push(makeGift({title:i[0], planned:i[1], bank:true, personId:p ? p.id : ''})); finder.saved.add(i[0]); save(); repaint(); toast(`Saved ${i[0]}.`, {undo:true});
},
finderMore() { finder.offset += 6; $('#finderOut').innerHTML = finderHTML(); },
starIdea(el) { if (!canEdit()) return; const g = gift(el.dataset.id); g.star = !g.star; touch(g); save(); repaint(); },
moveIdea(el) { if (!canEdit()) return; const g = gift(el.dataset.id); snap(); g.bank = false; touch(g); save(); repaint(); toast(`${g.title} moved to Gifts.`, {undo:true}); afterOver(g.personId, g); },
shopWho(el) { shopWho = el.dataset.k; repaint(); },
printShop() { return printShopping(false); },
printPartner() { return printShopping(true); },
printAddr() { return printAddresses(); },
tick(el) {
if (!canEdit()) return; const g = gift(el.dataset.id);
if (P.hidePrices) { snap(); setStatus(g, 'bought'); save(); repaint(); toast(`${g.title}: Bought`, {undo:true}); return; }
openTickSheet(g);
},
markHere(el) { if (!canEdit()) return; const g = gift(el.dataset.id); snap(); setStatus(g, 'here'); save(); repaint(); toast(`${g.title} is here.`, {undo:true}); },
markWrapped(el) { if (!canEdit()) return; const g = gift(el.dataset.id); snap(); setStatus(g, 'wrapped'); save(); repaint(); toast(`${g.title} is wrapped.`, {undo:true}); },
copyTrack(el) { copyText(gift(el.dataset.id).tracking); toast('Tracking copied.'); },
santaGo() { santaRun(); },
santaRedraw() { confirmSheet({title:'Redraw names?', body:'Everyone gets a new name, and anyone who already looked needs to look again.', yes:'Redraw', onYes:() => { santaRun(); }}); },
santaOpen(el) { santaUI = {who:el.dataset.n, shown:false}; paint(); window.scrollTo(0, 0); },
santaShow() { santaUI.shown = true; const z = santaOf(); if (!z.seen.includes(santaUI.who)) z.seen.push(santaUI.who); if (!RO()) save(); paint(); },
santaHide() { santaUI = null; paint(); },
santaBack() { santaUI = null; paint(); },
santaDel(el) { if (!canEdit()) return; const z = santaOf(), n = el.dataset.n; z.names = z.names.filter(x => x !== n); z.excl = z.excl.filter(p => !p.includes(n)); santaClear(z); },
santaExDel(el) { if (!canEdit()) return; const z = santaOf(); z.excl.splice(+el.dataset.i, 1); santaClear(z); },
addSeason() { openSeasonSheet(); },
startNext() {
const s = season();
confirmSheet({title:'Start next year?', body:`This makes ${nextSeasonName(s)} with the same people and budgets, and archives ${s.name} so it stays as a read-only record.`, yes:'Start next year', onYes:() => { snap(); startNextYear(s.id); save(); paint(); toast(`${season().name} is ready.`, {undo:true}); }});
},
switchSeason(el) { S.activeSeason = el.dataset.id; Object.assign(giftFilter, {q:'', person:'', status:'', store:''}); save(); paint(); toast(`Now showing ${season().name}.`); },
archiveSeason(el) { const s = season(el.dataset.id); s.archived = true; touch(s); save(); repaint(); },
reopenSeason(el) { const s = season(el.dataset.id); s.archived = false; touch(s); save(); repaint(); },
lockNow() { unlocked = false; lockForgot = false; lockMsg = ''; paint(); },
changePin() { openPinSheet(); },
clearPin() { confirmSheet({title:'Remove the PIN?', body:'The app opens without asking from now on. Your gifts stay as they are.', yes:'Remove PIN', onYes:() => { P.pin = null; savePrefs(); paint(); toast('PIN removed.'); }}); },
forgotPin() { lockForgot = true; lockMsg = ''; paint(); $('#forgotInput').focus(); },
forgotBack() { lockForgot = false; lockMsg = ''; paint(); },
backup() { download(`christmas-gift-tracker-backup-${todayStr()}.json`, JSON.stringify(exportObj('backup'), null, 1), 'application/json'); P.lastBackup = Date.now(); savePrefs(); repaint(); toast('Backup saved. Keep the file somewhere safe.'); },
shareFile() { download(`christmas-gift-tracker-share-${todayStr()}.json`, JSON.stringify(exportObj('share'), null, 1), 'application/json'); toast('Share file saved. Send it to your partner.'); },
csv() { download(`christmas-gift-tracker-${todayStr()}.csv`, csvFor(), 'text/csv;charset=utf-8'); toast('CSV saved.'); },
setTheme(el) { P.theme = el.dataset.k; savePrefs(); repaint(); },
loadSample() { loadSample(); askPersist(); view = 'home'; if (location.hash) location.hash = ''; paint(); window.scrollTo(0, 0); },
clearSample() { clearSample(); firstStep = 1; view = 'home'; if (location.hash) location.hash = ''; paint(); toast('The sample is gone.'); },
clearAll() {
confirmSheet({title:'Clear everything?', body:'This deletes every season, person and gift on this device. It cannot be undone.', yes:'Clear everything', danger:true, type:'CLEAR', onYes:() => {
S = blankData(); P = blankPrefs(); undoSnap = null; firstStep = 1; view = 'home'; unlocked = false;
try { localStorage.removeItem(KEY + 'data'); localStorage.removeItem(KEY + 'prefs'); } catch (e) { /* nothing stored */ }
if (location.hash) location.hash = ''; paint();
}});
},
firstSkip(el) { firstStep = +el.dataset.to; paint(); },
firstDone() { finishFirst(); }
};
function santaRun() {
const z = santaOf(), d = santaDraw(z.names, z.excl);
if (!d) { santaMsg = santaProblem(z.names, z.excl); z.draw = null; }
else { santaMsg = ''; z.draw = d; z.seen = []; }
touch(season()); save(); santaUI = null; repaint();
}
function santaClear(z) { z.draw = null; z.seen = []; santaMsg = ''; touch(season()); save(); repaint(); }
function finishFirst() { ensureSeason(); P.onboarded = true; P.firstUse = P.firstUse || Date.now(); savePrefs(); save(); askPersist(); view = 'home'; paint(); window.scrollTo(0, 0); }

/* ---------- forms ---------- */
function formErr(boxSel, msg) { const b = $(boxSel); if (b) b.innerHTML = `<div class="note red">${icon('alert')}<span>${esc(msg)}</span></div>`; }
const FORM = {
gift(f) {
const d = giftDraft(f); if (!d.title) { $('#giftWarn').innerHTML = `<div class="note red">${icon('alert')}<span>Give the gift a name first.</span></div>`; $('#gTitle').focus(); return; }
if (!canEdit()) return;
snap(); delete d.id; const warns = giftWarnings(Object.assign({id:f.dataset.id || '_new'}, d));
let g = f.dataset.id ? gift(f.dataset.id) : null;
if (g) { const st = d.status; delete d.status; Object.assign(g, d); setStatus(g, st); } else { g = makeGift(d); if (isBought(g) && g.paid == null) g.paid = g.planned; S.gifts.push(g); }
lastPersonId = g.personId; save(); closeSheet(); repaint();
toast(warns[0] || `Saved ${g.title}.`, warns[0] ? {warn:true} : {});
},
person(f) {
const name = f.elements.name.value.trim(); if (!name) { f.elements.name.focus(); return; }
if (!canEdit()) return;
const ex = f.dataset.id ? person(f.dataset.id) : null, group = f.elements.group.value.trim() || 'Family';
const d = {name, group, emoji:f.elements.emoji.value.trim(), sizes:f.elements.sizes.value.trim(), likes:f.elements.likes.value.trim(), address:f.elements.address.value.trim(), getsCard:f.elements.getsCard.checked};
if (f.elements.budget) d.budget = parsePrice(f.elements.budget.value) || 0;
snap(); if (!S.groups.includes(group)) S.groups.push(group);
if (ex) { Object.assign(ex, d); touch(ex); } else { const p = makePerson(d); S.people.push(p); lastPersonId = p.id; }
save(); closeSheet(); repaint(); toast(`Saved ${name}.`);
},
tick(f) { const g = gift(f.dataset.id), v = parsePrice(f.elements.paid.value); snap(); g.paid = v ?? g.planned ?? null; setStatus(g, 'bought'); save(); closeSheet(); repaint(); toast(`${g.title}: Bought for ${money(costOf(g))}`, {undo:true}); },
confirm(f) {
const t = f.dataset.type;
if (t && f.elements.t.value.trim() !== t) { formErr('#confirmErr', `Type ${t} exactly to go ahead.`); return; }
const fn = pendingYes; pendingYes = null; closeSheet(); if (fn) fn();
},
seasonNew(f) {
const name = f.elements.name.value.trim(), date = f.elements.date.value;
if (!name || !parseDay(date)) { formErr('#snErr', 'A season needs a name and a date.'); return; }
snap(); const s = makeSeason({name, date, budget:f.elements.budget ? (parsePrice(f.elements.budget.value) || 0) : 0}); S.seasons.push(s); S.activeSeason = s.id; save(); closeSheet(); repaint(); toast(`Now showing ${name}.`, {undo:true});
},
seasonEdit(f) {
if (!canEdit()) return; const s = season(), name = f.elements.name.value.trim(), date = f.elements.date.value;
if (!name || !parseDay(date)) { toast('A season needs a name and a date.'); return; }
s.name = name; s.date = date; if (f.elements.budget) s.budget = parsePrice(f.elements.budget.value) || 0; touch(s); save(); repaint(); toast('Season saved.');
},
santaName(f) { if (!canEdit()) return; const n = f.elements.n.value.trim(), z = santaOf(); if (!n) return; if (z.names.some(x => x.toLowerCase() === n.toLowerCase())) { toast(`${n} is already in.`); return; } z.names.push(n); santaClear(z); $('#santaName')?.focus(); },
santaExcl(f) { if (!canEdit()) return; const z = santaOf(), a = f.elements.a.value, b = f.elements.b.value; if (!a || a === b) { toast('Pick two different people.'); return; } if (z.excl.some(p => p.includes(a) && p.includes(b))) return; z.excl.push([a, b]); santaClear(z); },
santaLimit(f) { if (!canEdit()) return; const z = santaOf(); z.limit = parsePrice(f.elements.limit.value); touch(season()); save(); toast('Limit saved.'); },
async pinSet(f) {
const a = f.elements.a.value, b = f.elements.b.value;
if (a.length < 4) { formErr('#pinErr', 'Use at least 4 digits.'); return; }
if (a !== b) { formErr('#pinErr', 'Those two do not match. Try again.'); return; }
await setPin(a); unlocked = true; closeSheet(); repaint(); toast('PIN set.');
},
async unlock(f) { if (await checkPin(f.elements.p.value)) { unlocked = true; lockMsg = ''; paint(); } else { lockMsg = 'That is not the PIN. Try again.'; paint(); } },
forgot(f) {
if (f.elements.t.value.trim().toUpperCase() !== FORGOT) { lockMsg = `Type ${FORGOT} to clear the PIN.`; paint(); return; }
P.pin = null; savePrefs(); lockForgot = false; lockMsg = ''; unlocked = true; paint(); toast('PIN cleared. All your gifts are still here.');
},
async dgPin(f) { if (await checkPin(f.elements.p.value)) exitDisguise(); else { $('#dgErr').textContent = 'Try again.'; f.elements.p.value = ''; f.elements.p.focus(); } },
first1(f) {
const s = ensureSeason(), date = parseDay(f.elements.date.value) ? f.elements.date.value : defaultChristmas();
s.date = date; s.name = `Christmas ${date.slice(0, 4)}`; s.budget = parsePrice(f.elements.budget.value) || 0; touch(s); save(); firstStep = 2; paint(); $('#fPerson').focus();
},
first2(f) {
const name = f.elements.name.value.trim();
if (name) { const p = makePerson({name, group:f.elements.group.value}); S.people.push(p); lastPersonId = p.id; save(); }
firstStep = 3; paint(); $('#fGift').focus();
},
first3(f) {
const title = f.elements.title.value.trim();
if (title) { S.gifts.push(makeGift({title, planned:parsePrice(f.elements.price.value), personId:lastPersonId})); save(); }
finishFirst();
}
};

/* ---------- events ---------- */
document.addEventListener('click', e => {
if (e.target === $('#sheet')) { closeSheet(); return; }
const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
const fn = ACT[el.dataset.act]; if (fn) fn(el, e);
});
document.addEventListener('submit', e => {
const f = e.target.closest('form[data-form]'); if (!f) return;
e.preventDefault(); FORM[f.dataset.form](f);
});
document.addEventListener('input', e => {
const t = e.target;
if (t.id === 'giftSearch') { giftFilter.q = t.value; $('#giftList').innerHTML = giftListHTML(); }
else if (t.id === 'seasonSearch') { seasonQ = t.value; $('#seasonOut').innerHTML = seasonResults(); }
else if (t.closest('form[data-form=gift]')) updateGiftWarn();
});
document.addEventListener('change', e => {
const t = e.target, d = t.dataset;
if (d.filter) { giftFilter[d.filter] = t.value; $('#giftList').innerHTML = giftListHTML(); }
else if (d.pick === 'fair') { fairGroup = t.value; repaint(); }
else if (d.pick === 'finder') { finder[d.k] = t.value; finder.offset = 0; $('#finderOut').innerHTML = finderHTML(); }
else if (d.toggle) {
if (!canEdit()) { t.checked = !t.checked; return; }
const p = person(d.id); p[d.toggle] = t.checked; touch(p); save(); repaint();
$(`[data-toggle="${d.toggle}"][data-id="${d.id}"]`)?.focus({preventScroll:true});
}
else if (d.grocery != null) { P.grocery[d.grocery] = t.checked; savePrefs(); }
else if (d.pref === 'large') { P.large = t.checked; savePrefs(); applyPrefs(); }
else if (d.pref === 'currency') { P.currency = t.value.trim() || '$'; savePrefs(); repaint(); }
else if (d.groupI != null) {
const old = S.groups[+d.groupI], nw = t.value.trim(); if (!nw || nw === old) { t.value = old; return; }
S.groups[+d.groupI] = nw; S.people.forEach(p => { if (p.group === old) { p.group = nw; touch(p); } }); save(); repaint();
}
else if (t.id === 'santaLimit') { FORM.santaLimit(t.form); }
else if (d.file) {
const file = t.files[0], kind = d.file; if (!file) return;
if (file.size > 2e7) { importMsg = 'This file is too large to be a gift list. Nothing was changed.'; paint(); return; }
const r = new FileReader(); r.onload = () => handleFile(kind, String(r.result)); r.onerror = () => { importMsg = 'This file could not be read. Nothing was changed.'; paint(); }; r.readAsText(file);
}
});
/* Disguise exit: press and hold the heading (pointer or keyboard). */
document.addEventListener('pointerdown', e => { if (e.target.id === 'dgTitle') holdStart(); });
['pointerup', 'pointercancel', 'pointerleave'].forEach(n => document.addEventListener(n, e => { if (e.target.id === 'dgTitle' || n === 'pointerup') holdEnd(); }, true));
document.addEventListener('keydown', e => { if (e.target.id === 'dgTitle' && (e.key === 'Enter' || e.key === ' ') && !e.repeat) { e.preventDefault(); holdStart(); } });
document.addEventListener('keyup', e => { if (e.target.id === 'dgTitle') holdEnd(); });
document.addEventListener('contextmenu', e => { if (e.target.id === 'dgTitle') e.preventDefault(); });
window.addEventListener('hashchange', () => { view = location.hash.slice(1) || 'home'; santaUI = null; closeSheet(); if (mode() === 'app') { paint(); window.scrollTo(0, 0); } });
window.addEventListener('storage', e => { if (e.key && e.key.startsWith(KEY) && !$('#sheet').open) { load(); paint(); } });
if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyPrefs);

/* ---------- boot ---------- */
load();
if (DEMO && !S.seasons.length) loadSample();
view = location.hash.slice(1) || 'home';
if (P.onboarded) askPersist();
paint();
</script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');</script></body>
